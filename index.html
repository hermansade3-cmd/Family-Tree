<h3>Taarifa hazijakamilika (${inc.length})</h3>${inc.slice(0,8).map(row).join('')||'<p class=m>Hakuna.</p>'}`}

if(!o.name){alert('Jina linahitajika.');return false}const ds=id?desc(id):[];
for(const k of['father','mother'])if(o[k]&&(o[k]==id||ds.includes(o[k]))){alert('Uhusiano huu hauwezekani (mzunguko wa vizazi).');return false}
if(!id&&S.persons.some(x=>x.name.toLowerCase()==o.name.toLowerCase()&&x.birth==o.birth)&&!confirm('Mtu mwenye jina na tarehe hii tayari yupo. Endelea?'))return false;
const y=s=>parseInt(s)||0;for(const k of['father','mother'])if(o[k]&&y(byId(o[k]).birth)&&y(o.birth)&&y(byId(o[k]).birth)>=y(o.birth)){alert('Tahadhari: mzazi anaonekana kuzaliwa baada ya mtoto. Imewekwa KINZANI kwa uhakiki.');o.status='KINZANI'}

function prof(id){const p=byId(id);if(!p)return;const lk=(x,h)=>`<a onclick="prof('${x.id}')">${esc(x.name)}</a>${h?' (nusu)':''}`,R=(l,a)=>a.length?`<p><b>${l}:</b> ${a.join(', ')}</p>`:'';
const f=byId(p.father),mo=byId(p.mother),sb=sibs(id),par=[f,mo].filter(Boolean),gp=uniq(par.flatMap(x=>[byId(x.father),byId(x.mother)])),ks=kids(id),gk=uniq(ks.flatMap(x=>kids(x.id))),ggk=uniq(gk.flatMap(x=>kids(x.id))),un=uniq(par.flatMap(x=>sibs(x.id))),cz=uniq(un.flatMap(x=>kids(x.id)));
const mar=S.marriages.filter(m=>m.a==id||m.b==id);
$('#m').innerHTML=`<div class=box><div class=p style="cursor:default">${av(p).replace('42px','64px')}<div><h3 style="margin:0">${esc(p.name)} ${p.sex=='M'?'♂':'♀'}</h3><div class=m>${esc(p.nick?'“'+p.nick+'” · ':'')}${yrs(p)} · <span class=b>${p.status}</span></div></div></div>
<div class=row><button onclick="pic('${id}')">📷 Picha</button><button onclick="pform('${id}')">${t('ed')}</button><button onclick="mform('${id}')">⚭ Mwenzi</button><button onclick="TR.root='${id}';cl();go('t')">Mti</button></div>
${[['Ukoo',cn(p.clan)],['Alizaliwa',p.bplace],['Alizikwa',p.grave],['Kazi',p.job],['Anaishi',p.live],['Simu',p.phone],['Dini',p.rel],['Historia',p.bio]].filter(a=>a[1]).map(a=>`<p><b>${a[0]}:</b> ${esc(a[1])}</p>`).join('')}<hr>
${R('Baba',f?[lk(f)]:[])}${R('Mama',mo?[lk(mo)]:[])}${p.adopt?'<p class=m>Mtoto wa kuasili/malezi</p>':''}${R('Mwenzi (ndoa)',mar.map(m=>`${lk(byId(m.a==id?m.b:m.a))}${m.year?' ('+esc(m.year)+')':''} <a onclick="dm('${m.id}','${id}')">✕</a>`))}${R('Watoto',ks.map(x=>lk(x)))}${R('Ndugu',sb.map(x=>lk(x,!(p.father&&x.father==p.father&&p.mother&&x.mother==p.mother))))}${R('Babu/Bibi',gp.map(x=>lk(x)))}${R('Wajukuu',gk.map(x=>lk(x)))}${R('Vitukuu',ggk.map(x=>lk(x)))}${R('Wajomba/Shangazi',un.map(x=>lk(x)))}${R('Binamu',cz.map(x=>lk(x)))}
<div class=row><button onclick="dp('${id}')">${t('del')}</button><button onclick="cl()">${t('x')}</button></div></div>`;$('#m').className='on'}
function mform(id){const o=[['','—'],...S.persons.filter(x=>x.id!=id&&!spIds(id).includes(x.id)).map(x=>[x.id,x.name])];form('Ongeza mwenzi wa ndoa',[{id:'w',l:'Mwenzi',t:'s',o},{id:'y',l:'Mwaka wa ndoa'}],r=>{if(!r.w){alert('Chagua mtu.');return false}S.marriages.push({id:uid(),a:id,b:r.w,year:r.y});log('Ndoa: '+nm(id)+' & '+nm(r.w));save();render();setTimeout(()=>prof(id),0)})}

return `<div class=row>${sel('tc',[['','Koo zote'],...S.clans.map(c=>[c.id,c.name])],TR.clan,"TR.clan=this.value;TR.root='';render()")}${sel('tr',ps,TR.root,"TR.root=this.value;render()")}${sel('td',[[99,'Vizazi vyote'],[1,'Kizazi 1'],[2,'Vizazi 2'],[3,'Vizazi 3'],[4,'Vizazi 4']],TR.depth,"TR.depth=+this.value;render()")}<button onclick="zm(1.25)">＋</button><button onclick="zm(.8)">－</button></div><svg id=sv></svg><p class=m>Buruta kusogeza · kunjua kwa ＋/－ au gurudumu · bonyeza kadi kufungua taarifa. Mstari uliokatika = amefariki; bluu = me, pinki = ke.</p>`}

let TW=0;
